<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--canvas); }
  svg { position: absolute; inset: 0; }
  .ink { fill: var(--ink); } .pulse { fill: var(--pulse); } .pac { fill: var(--surface); } .tint { fill: var(--surface-2); } .mint { fill: var(--mint-mark); } .coral { fill: var(--coral-mark); } .ground { fill: var(--canvas); } .ln { stroke: var(--line); fill: none; }
  .name { position: absolute; left: 48px; bottom: 64px; font: 500 72px/0.95 var(--font-sans); letter-spacing: -0.03em; color: var(--ink); }
  .tag { position: absolute; left: 50px; bottom: 32px; font: 400 15px/20px var(--font-sans); color: var(--muted); }
  .sh { filter: drop-shadow(0 8px 24px rgba(11,27,43,0.12)) drop-shadow(0 1px 2px rgba(11,27,43,0.06)); }
</style></head>
<body>
<div class="cover">
  <!--
    blocks: three cards on the cool canvas, stepping down and right (space-12 multiples), radius-lg 16 and radius-xl 24;
    the buyer disc (surface white, radius-pill) with an ink mouth wedge sits on the ink card; the four seller marks are the
    semantic colours (slate, coral, amber, mint) as 24 px dots on the muted card; one pulse button block.
    arrangement: everything right of x = 480; one ink slab bleeding off the right edge, the way the dark app meets the light one.
  -->
  <svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
    <g class="sh">
      <rect class="tint" x="504" y="48" width="240" height="204" rx="16"/>
      <rect class="ink" x="696" y="0" width="264" height="300" rx="24"/>
    </g>
    <rect class="pulse" x="528" y="200" width="120" height="28" rx="8"/>
    <rect class="ln" x="528.5" y="76.5" width="192" height="12" rx="6"/>
    <rect class="ln" x="528.5" y="104.5" width="144" height="12" rx="6"/>
    <circle cx="540" cy="160" r="8" fill="#8fa0b2"/>
    <circle cx="572" cy="160" r="8" class="coral"/>
    <circle cx="604" cy="160" r="8" fill="#fcd34d"/>
    <circle cx="636" cy="160" r="8" class="mint"/>
    <circle class="pac" cx="828" cy="150" r="60"/>
    <path class="ink" d="M828 150 L888 115 A60 60 0 0 0 888 185 Z"/>
    <circle class="ink" cx="836" cy="124" r="5"/>
  </svg>
  <div class="name">Tech Bazaar</div>
  <div class="tag">Your agent shops. You approve.</div>
</div>
</body>
</html>

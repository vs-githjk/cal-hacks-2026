<!-- @dsCard group="Outside" height=200 subtitle="Every state says its word; colour never carries meaning alone" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<div class="tb">
  <div class="card" style="display:grid;gap:16px">
    <div>
      <div class="cap" style="margin-bottom:8px">Round and deal states</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <span class="pill pill-live"><span class="dot"></span>Live</span>
        <span class="pill pill-sealed">Sealed</span>
        <span class="pill pill-eaten">Eaten</span>
        <span class="pill pill-vetoed">Vetoed</span>
        <span class="pill pill-blocked">Blocked by Shield</span>
        <span class="pill pill-approved">Approved</span>
        <span class="pill pill-paid">Paid</span>
        <span class="pill pill-denied">Denied</span>
        <span class="pill pill-referee">CRS verified_stable</span>
      </div>
    </div>
    <div>
      <div class="cap" style="margin-bottom:8px">Honesty labels (from the source field on every bid, claim and screen)</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <span class="pill pill-live">LIVE</span>
        <span class="pill pill-mirror">MIRROR · dated listing</span>
        <span class="pill pill-sim">SIM</span>
        <span class="pill pill-caution">Env-gated</span>
        <span class="pill pill-caution">Uncertain fit</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!-- @dsCard group="Floor" height=720 subtitle="2.5D Pac-Man boxing ring: 4 sellers, 3 sealed rounds, Shield block, referee call, checker tick, walk-out" -->
<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: var(--floor-bg); color: var(--floor-line); font-family: var(--font-mono); }
  .stage { position: relative; width: 100%; max-width: 960px; margin: 0 auto; background: var(--floor-bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; }
  .hud { position: absolute; left: 16px; top: 14px; right: 16px; pointer-events: none; }
  .hud .live { font: 500 11px/16px var(--font-mono); letter-spacing: 0.06em; color: #a9a6c2; text-transform: uppercase; }
  .hud .live b { color: var(--referee); font-weight: 500; }
  .hud .round { font: 400 14px/22px var(--font-arcade); color: var(--floor-line); margin-top: 6px; }
  .hud .round .part { color: var(--pac); }
  .call { position: absolute; left: 16px; top: 68px; max-width: 58%; display: none; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #1b1530; border: 1px solid var(--referee); color: var(--floor-line); font: 500 12px/16px var(--font-mono); }
  .call.on { display: inline-flex; }
  .call b { color: var(--referee); font-weight: 500; letter-spacing: 0.06em; }
  .pip { position: absolute; right: 16px; top: 14px; width: 22%; min-width: 128px; max-width: 220px; border-radius: 24px; background: #121620eb; border: 1px solid #ffffff2e; box-shadow: 0 12px 32px #000000a6; overflow: hidden; }
  .pip .head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #ffffff1a; font: 500 10px/14px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: #b7bfcc; }
  .pip .head .d { width: 6px; height: 6px; border-radius: 50%; background: var(--shield); box-shadow: 0 0 0 3px #6f93ff40; }
  .pip .msgs { padding: 10px 12px; display: grid; gap: 6px; }
  .pip .m { font: 400 11px/15px var(--font-sans); padding: 6px 8px; border-radius: 10px; background: #1a1f2b; color: #edf0f5; max-width: 95%; }
  .pip .m.you { background: var(--shield); color: #0b0d12; justify-self: end; }
  .ledger { position: absolute; left: 16px; right: 16px; bottom: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .seller { background: #10131fe6; border: 1px solid #ffffff24; border-radius: 12px; padding: 8px 10px; min-width: 0; }
  .seller .n { display: flex; align-items: center; gap: 6px; font: 500 10px/14px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: #b7bfcc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seller .n i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .seller .p { font: 500 15px/20px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--floor-line); margin-top: 2px; }
  .seller .s { font: 500 10px/14px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; color: #8b95a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seller.sealed .p { color: #8b95a7; }
  .seller.out { opacity: 0.55; }
  .seller.out .s { color: var(--ghost-1); }
  .seller.win { border-color: var(--checker); }
  .seller.win .s { color: var(--checker); }
  .seller.warn .s { color: var(--ghost-4); }
  .end { position: absolute; inset: 0; display: none; place-items: center; background: #07080fcc; text-align: center; padding: 24px; }
  .end.on { display: grid; }
  .end .k { font: 400 18px/24px var(--font-arcade); color: var(--pac); }
  .end .t { font: 400 28px/34px var(--font-serif); color: var(--floor-line); margin-top: 10px; }
  .end .l { font: 400 12px/18px var(--font-mono); color: #b7bfcc; margin-top: 8px; }
  .end .l b { color: var(--checker); font-weight: 500; }
  .ctl { display: flex; gap: 8px; justify-content: center; padding: 10px 16px 14px; max-width: 960px; margin: 0 auto; }
  .ctl button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #ffffff33; background: #121620; color: var(--floor-line); font: 500 12px/16px var(--font-mono); cursor: pointer; }
  .ctl button:focus-visible { outline: 2px solid var(--shield); outline-offset: 2px; }
  .ctl .ph { align-self: center; font: 400 11px/16px var(--font-mono); color: #8b95a7; }
  @media (max-width: 640px) {
    .ledger { position: static; grid-template-columns: repeat(2, 1fr); padding: 8px 16px 4px; }
    .hud { right: calc(34% + 24px); }
    .hud .round { font-size: 11px; line-height: 16px; }
    .call { top: 64px; max-width: 60%; font-size: 11px; }
    .pip { width: 34%; }
    .pip .msgs .m:nth-child(n+3) { display: none; }
  }
</style>
</head>
<body>

  </div>
  <div class="call" id="call"><b>REFEREE</b><span id="calltext"></span></div>
  <div class="pip" aria-label="ASI:One chat, mirrored">
    <div class="head"><span class="d"></span>ASI:One · the buyer</div>
    <div class="msgs" id="msgs"></div>
  </div>
  <div class="ledger" id="ledger"></div>
  <div class="end" id="end"><div>
    <div class="k">DEAL</div>
    <div class="t">ASUS Prime RTX 5070 Ti OC · $1,299.99</div>
    <div class="l"><b>fit confirmed</b> 304 mm · <b>no recall</b> · <b>CRS verified_stable</b> · above allowance: approved by phone code</div>
  </div></div>
</div>
<div class="ctl">
  <button id="prev" type="button">Prev</button>
  <button id="play" type="button">Pause</button>
  <button id="next" type="button">Next</button>
  <span class="ph" id="ph"></span>
</div>

    { id: 2, name: 'Seller 2 · Injected', color: T('ghost-2'), price: '$1,189.00', u: -0.2, v: 0.7, home: [-0.45, 0.05, 0.5, 0.85] },
    { id: 3, name: 'Seller 3 · eBay mirror', color: T('ghost-3'), price: '$1,222.23', u: 0.3, v: 0.72, home: [0.05, 0.5, 0.5, 0.85] },
    { id: 4, name: 'Seller 4 · Best Buy mirror', color: T('ghost-4'), price: '$1,299.99', u: 0.62, v: 0.35, home: [0.3, 0.9, 0.2, 0.6] }

    { d: 1400, go: function () { shield.on = true; shield.u = ref.u; shield.v = ref.v + 0.1; tween(shield, (pac.u + sellers[1].u) / 2, (pac.v + sellers[1].v) / 2, 500); shield.flash = now; sellers[1].badge = 'BLOCKED · SHIELD'; sellers[1].status = 'SHIELD BLOCKED'; state.chat.push(['me', 'Shield blocked seller 2: override attempt in the listing.']); } },

    { d: 1600, go: function () { ref.arms = 0; shield.on = false; state.call = ''; pac.face = 1; tween(pac, 0, 0.55, 600); state.round = 'ROUND 3 OF 3 · <span class="part">GPU</span> · 2 SELLERS · REVEALED'; sellers[2].sealed = false; sellers[3].sealed = false; state.chat.push(['me', 'Final. The checker verifies fit and recalls.']); } },
    { d: 1100, go: function () { tween(checker, sellers[2].u + 0.14, sellers[2].v - 0.08, 700); }, run: function (k) { if (k > 0.75) { sellers[2].status = 'FIT UNCERTAIN · CONDITION UNKNOWN'; sellers[2].badge = 'OUT · FIT UNCERTAIN'; } } },
    { d: 1100, go: function () { tween(checker, sellers[3].u - 0.14, sellers[3].v - 0.08, 700); }, run: function (k) { if (k > 0.75) sellers[3].status = 'FIT OK · 304 MM · NO RECALL'; } },

    { d: 1700, go: function () { ref.arms = 0; state.call = 'Winner: seller 4 at $1,299.99 · CRS verified_stable'; tween(checker, 0.85, 0.12, 700); sellers[3].status = 'WINNER · CRS VERIFIED_STABLE'; state.chat.push(['me', 'Winner $1,299.99. Above your allowance, so I am calling you with the code.']); sellers[3].blueT = now; }, run: function (k) { var q = easeOut(Math.min(1, k * 1.6)); sellers[3].blue = q; sellers[3].grow = 1 + 0.6 * q; } },

    var cy = p.y - r, a0 = m * Math.PI, dir = pac.face > 0 ? 0 : Math.PI;
    ctx.fillStyle = C.pac; ctx.beginPath(); ctx.moveTo(p.x, cy); ctx.arc(p.x, cy, r, dir + a0, dir - a0 + Math.PI * 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.pacShade; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.moveTo(p.x, cy); ctx.arc(p.x, cy, r, Math.max(dir + a0, 0.15 * Math.PI), Math.min(0.85 * Math.PI, dir - a0 + Math.PI * 2)); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = C.tagInk; ctx.beginPath(); ctx.arc(p.x + pac.face * r * 0.25, cy - r * 0.45, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.font = '500 ' + Math.round(10 * sc) + 'px ' + T('font-mono'); ctx.textAlign = 'center'; ctx.fillStyle = C.pac; ctx.fillText('THE BUYER', p.x, cy - r - 8 * sc);
  }
  function drawRef() {
    var p = P(ref.u, ref.v), sc = S(ref.v), h = 64 * sc; shadow(p, 12 * sc);
    ctx.strokeStyle = C.line; ctx.lineWidth = 2.5 * sc; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y - h * 0.55); ctx.lineTo(p.x, p.y - h * 0.2); ctx.moveTo(p.x, p.y - h * 0.2); ctx.lineTo(p.x - 8 * sc, p.y); ctx.moveTo(p.x, p.y - h * 0.2); ctx.lineTo(p.x + 8 * sc, p.y); ctx.stroke();
    var ay = ref.arms ? -h * 0.8 : -h * 0.3; ctx.beginPath(); ctx.moveTo(p.x, p.y - h * 0.5); ctx.lineTo(p.x - 12 * sc, p.y + ay); ctx.moveTo(p.x, p.y - h * 0.5); ctx.lineTo(p.x + 12 * sc, p.y + ay); ctx.stroke();
    // striped shirt
    for (var k = 0; k < 4; k++) { ctx.fillStyle = k % 2 ? C.ref : C.line; ctx.fillRect(p.x - 7 * sc, p.y - h * 0.55 + k * 5 * sc, 14 * sc, 4 * sc); }
    ctx.fillStyle = C.line; ctx.beginPath(); ctx.arc(p.x, p.y - h * 0.68, 8 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.font = '500 ' + Math.round(10 * sc) + 'px ' + T('font-mono'); ctx.textAlign = 'center'; ctx.fillStyle = C.ref; ctx.fillText('CRS REFEREE', p.x, p.y - h * 0.68 - 14 * sc);
  }
  function drawChecker() {
    var p = P(checker.u, checker.v), sc = S(checker.v); shadow(p, 10 * sc);
    ctx.fillStyle = C.check; roundRect(p.x - 10 * sc, p.y - 28 * sc, 20 * sc, 24 * sc, 5 * sc); ctx.fill();
    ctx.strokeStyle = C.tagInk; ctx.lineWidth = 2.5 * sc; ctx.beginPath(); ctx.moveTo(p.x - 5 * sc, p.y - 16 * sc); ctx.lineTo(p.x - 1 * sc, p.y - 12 * sc); ctx.lineTo(p.x + 6 * sc, p.y - 21 * sc); ctx.stroke();
    ctx.font = '500 ' + Math.round(10 * sc) + 'px ' + T('font-mono'); ctx.textAlign = 'center'; ctx.fillStyle = C.check; ctx.fillText('CHECKER', p.x, p.y - 34 * sc);
  }
  function drawShield() {
    var p = P(shield.u, shield.v), sc = S(shield.v), r = 30 * sc, fl = now - shield.flash < 240 && Math.floor((now - shield.flash) / 120) % 2 === 0;
    ctx.beginPath(); for (var k = 0; k < 6; k++) { var a = Math.PI / 3 * k - Math.PI / 6; ctx.lineTo(p.x + r * Math.cos(a), p.y - 28 * sc + r * Math.sin(a)); } ctx.closePath();
    ctx.fillStyle = fl ? C.shield : 'rgba(111,147,255,0.22)'; ctx.fill(); ctx.strokeStyle = C.shield; ctx.lineWidth = 2.5 * sc; ctx.stroke();
    ctx.font = '500 ' + Math.round(10 * sc) + 'px ' + T('font-mono'); ctx.textAlign = 'center'; ctx.fillStyle = fl ? C.tagInk : C.shield; ctx.fillText('SHIELD', p.x, p.y - 32 * sc);
  }
  function mix(a, b, t) { var A = hex(a), B = hex(b); return 'rgb(' + [0, 1, 2].map(function (k) { return Math.round(A[k] + (B[k] - A[k]) * t); }).join(',') + ')'; }
  function hex(h) { h = h.replace('#', ''); return [0, 2, 4].map(function (k) { return parseInt(h.substr(k, 2), 16); }); }

  var roundEl = document.getElementById('round'), callEl = document.getElementById('call'), callText = document.getElementById('calltext'), msgs = document.getElementById('msgs'), ledger = document.getElementById('ledger'), endEl = document.getElementById('end'), phEl = document.getElementById('ph');
  function dom() {
    roundEl.innerHTML = state.round; callText.textContent = state.call; callEl.className = 'call' + (state.call ? ' on' : '');
    var last3 = state.chat.slice(-3); msgs.innerHTML = last3.map(function (m) { return '<div class="m ' + m[0] + '">' + m[1] + '</div>'; }).join('');
    ledger.innerHTML = sellers.map(function (s) { var cls = 'seller' + (s.sealed ? ' sealed' : '') + (s.eaten > 0 ? ' out' : '') + (s.status.indexOf('WINNER') === 0 || s.status.indexOf('FIT OK') === 0 ? ' win' : '') + (s.status.indexOf('FIT UNCERTAIN') === 0 ? ' warn' : '');
      return '<div class="' + cls + '"><div class="n"><i style="background:' + s.color + '"></i>' + s.name + '</div><div class="p">' + (s.sealed ? 'SEALED' : s.price) + '</div><div class="s">' + (s.status || (s.sealed ? 'bid in' : 'revealed')) + '</div></div>'; }).join('');
    endEl.className = 'end' + (state.end ? ' on' : ''); phEl.textContent = 'step ' + (i + 1) + ' of ' + ph.length;
  }
  function frame(t) {
    var dt = Math.min(50, t - last); last = t; if (playing && !document.hidden) now += dt;
    var cur = ph[i], k = Math.min(1, (now - t0) / cur.d); if (cur.run) cur.run(k);
    if (playing && k >= 1) enter((i + 1) % ph.length);
    stepTweens(); render(); dom(); requestAnimationFrame(frame);
  }
  function jump(n) { reset(); now = 0; t0 = 0; for (var j = 0; j <= n; j++) { i = j; t0 = now; if (ph[j].go) ph[j].go(); if (j < n) { now += ph[j].d; if (ph[j].run) ph[j].run(1); [pac, checker, shield].concat(sellers).forEach(function (e) { if (e.tw) { e.u = e.tw.u1; e.v = e.tw.v1; e.tw = null; } }); } } }
  document.getElementById('next').onclick = function () { jump((i + 1) % ph.length); };
  document.getElementById('prev').onclick = function () { jump((i - 1 + ph.length) % ph.length); };
  document.getElementById('play').onclick = function () { playing = !playing; this.textContent = playing ? 'Pause' : 'Play'; };
  reset(); enter(0); requestAnimationFrame(frame);
})();

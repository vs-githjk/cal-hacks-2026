name: market-tests

on:
  pull_request:
    paths: ["market/**", "contracts/**", ".github/workflows/market-tests.yml"]
  push:
    branches: [main, lane-b-market-floor]
    paths: ["market/**", "contracts/**", ".github/workflows/market-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci --prefix market && npm ci --prefix market/spacetimedb
      # Includes INVARIANT-1 (no payment without an approval for the same mandate hash).
      - name: Rules and reducer tests
        run: npm test --prefix market
      - name: Type check
        run: npm run typecheck --prefix market
